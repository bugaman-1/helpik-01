{% extends 'quiz/base.html' %}{% block title %}Вход · Компас{% endblock %}{% block content %}
<div class="auth-symbol"><svg><use href="#i-shield"/></svg></div><p class="eyebrow">РАДЫ ВАС ВИДЕТЬ</p><h1>Войти в аккаунт</h1>
{% if form.errors %}<p class="error" role="alert">Неверный логин или пароль. Проверьте введённые данные.</p>{% endif %}
<form method="post" class="auth-form">{% csrf_token %}<label for="id_username">Логин</label><input type="text" name="username" id="id_username" autocomplete="username" placeholder="Ваш логин" required autofocus><label for="id_password">Пароль</label><input type="password" name="password" id="id_password" autocomplete="current-password" placeholder="Введите пароль" required><button type="submit" class="btn primary">Войти <svg class="icon"><use href="#i-arrow"/></svg></button></form><p class="auth-hint">Ещё нет аккаунта? <a href="{% if prototype_self_service %}{% url 'register_patient' %}{% else %}{% url 'invitation_exchange' %}{% endif %}">Создать аккаунт</a></p>
{% endblock %}
