{% if check.uncertainty %}<details class="drug-uncertainty"><summary>Где недостаточно информации</summary>{% for item in check.uncertainty %}<article class="drug-finding unknown"><b>{{ item.medicine }}</b><p>{{ item.comment }}</p>{% if item.checked_at %}<p class="small-text muted">Поиск и проверка: {{ item.checked_at }}</p>{% endif %}<div class="drug-sources">{% for source in item.sources %}<a href="{{ source.url }}" target="_blank" rel="noopener noreferrer" title="{{ source.kind }}">{{ source.title }}</a>{% endfor %}</div></article>{% endfor %}</details>{% endif %}
