<p class="notice">Демо · не сохраняется</p>
<div class="grid-2">{% for med in medicines %}<article class="panel medicine-card" data-demo-card><div class="row spread"><span class="medicine-time">{{ med.time }}</span><span class="badge demo">Демо</span></div><div class="row"><span class="mini-icon"><svg><use href="#i-pill"/></svg></span><div><h3>{{ med.name }}</h3><p class="dose">{{ med.dose }}</p></div></div><p class="muted small-text" style="margin-top:14px">{{ med.note }}</p><div class="actions"><button type="button" class="primary" data-demo-status="Принято · демо · не сохраняется">✓ Принято</button><button type="button" data-demo-status="Пропущено · демо · не сохраняется">Пропущено</button></div><p class="demo-feedback" role="status">Отметки ещё нет</p></article>{% empty %}<div class="panel empty"><h3>Расписание пусто</h3><p class="muted">Здесь появятся подтверждённые врачом назначения.</p></div>{% endfor %}</div>
